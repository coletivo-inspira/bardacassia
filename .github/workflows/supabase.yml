name: Deploy Supabase (database + Edge Functions)

on:
  push:
    branches: ["main"]
    paths: ["supabase/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "supabase-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase deploy skipped: set secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD and variable SUPABASE_PROJECT_REF."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --include-all
      - name: Configure function secrets
        if: steps.config.outputs.ready == 'true' && env.ALLOWED_ORIGINS != ''
        run: supabase secrets set ALLOWED_ORIGINS="$ALLOWED_ORIGINS" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Edge Functions
        if: steps.config.outputs.ready == 'true'
        run: |
          supabase functions deploy account-delete --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy deezer-proxy --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
