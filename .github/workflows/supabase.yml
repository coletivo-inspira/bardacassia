name: Deploy Supabase (database + Edge Functions)

on:
  push:
    branches: ["main"]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "supabase-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Optional: Dashboard → Connect → Session pooler URI (IPv4). Overrides the auto-built URL.
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Supabase deploy skipped: set secrets SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD and variable SUPABASE_PROJECT_REF."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest
      - name: Link project
        if: steps.config.outputs.ready == 'true'
        # Default uses the shared pooler; do not pass --skip-pooler (that forces IPv6-only direct host).
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        if: steps.config.outputs.ready == 'true'
        # GitHub Actions is IPv4-only. Direct db.<ref>.supabase.co is IPv6 → use session pooler :5432.
        run: |
          set -euo pipefail
          if [ -n "${SUPABASE_DB_URL:-}" ]; then
            DB_URL="$SUPABASE_DB_URL"
            echo "Using SUPABASE_DB_URL secret (session pooler from Dashboard → Connect)."
          else
            REGION=$(curl -fsS \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF" | jq -r '.region')
            if [ -z "$REGION" ] || [ "$REGION" = "null" ]; then
              echo "::error::Could not resolve project region from the Management API. Set secret SUPABASE_DB_URL to the Session pooler URI from Dashboard → Connect."
              exit 1
            fi
            ENCODED_PASS=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['SUPABASE_DB_PASSWORD'], safe=''))")
            POOLER_HOST="aws-0-${REGION}.pooler.supabase.com"
            DB_URL="postgresql://postgres.${SUPABASE_PROJECT_REF}:${ENCODED_PASS}@${POOLER_HOST}:5432/postgres"
            echo "Using shared session pooler at ${POOLER_HOST} (region ${REGION})."
          fi
          if ! supabase db push --include-all --remote="$DB_URL" --yes; then
            echo "::error::db push failed. If the host/tenant was wrong, set secret SUPABASE_DB_URL to the exact Session pooler URI from Dashboard → Connect (port 5432) and re-run this workflow."
            exit 1
          fi
      - name: Configure function secrets
        if: steps.config.outputs.ready == 'true' && env.ALLOWED_ORIGINS != ''
        run: supabase secrets set ALLOWED_ORIGINS="$ALLOWED_ORIGINS" --project-ref "$SUPABASE_PROJECT_REF"
      - name: Deploy Edge Functions
        if: steps.config.outputs.ready == 'true'
        run: |
          supabase functions deploy account-delete --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy deezer-proxy --no-verify-jwt --project-ref "$SUPABASE_PROJECT_REF"
