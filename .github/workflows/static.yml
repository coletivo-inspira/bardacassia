name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          VITE_ENABLE_SPOTIFY: ${{ vars.ENABLE_SPOTIFY }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          VITE_ENABLE_DISCOVERY: ${{ vars.ENABLE_DISCOVERY }}
          VITE_ENABLE_POPULARITY: ${{ vars.ENABLE_POPULARITY }}
          VITE_ENABLE_AUTH: ${{ vars.ENABLE_AUTH }}
          VITE_AUTH_PROVIDERS: ${{ vars.AUTH_PROVIDERS }}
          VITE_AUTH_CAPTCHA_SITE_KEY: ${{ vars.AUTH_CAPTCHA_SITE_KEY }}
          VITE_DEEZER_PROXY_URL: ${{ vars.DEEZER_PROXY_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run build
          npm run sync-catalog
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
