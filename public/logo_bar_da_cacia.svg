<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <!-- Recorte principal do fundo arredondado e do filete curvo à esquerda -->
    <clipPath id="bgShapesClip">
      <!-- Oval principal inclinada do fundo -->
      <path d="M 322 182
               C 445 88, 635 90, 742 162
               C 832 222, 832 355, 772 458
               C 715 555, 580 635, 420 645
               C 265 655, 162 560, 165 430
               C 168 320, 228 245, 322 182 Z" />
      <!-- Filete em meia-lua separado na borda inferior esquerda -->
      <path d="M 148 352
               C 112 450, 118 565, 222 652
               C 238 662, 258 656, 245 640
               C 155 558, 138 458, 152 356 Z" />
    </clipPath>
  </defs>

  <!-- Fundo colorido em faixas diagonais suaves -->
  <g clip-path="url(#bgShapesClip)">
    <!-- Faixa 1: Rosa pastel suave (topo esquerdo) -->
    <polygon points="0,0 1000,0 1000,750 0,750" fill="#e5c5be" />
    <!-- Faixa 2: Pêssego / Laranja claro -->
    <polygon points="0,285 620,0 1000,0 1000,750 0,750" fill="#e5c899" />
    <!-- Faixa 3: Amarelo pastel -->
    <polygon points="0,415 800,35 1000,35 1000,750 0,750" fill="#e3d588" />
    <!-- Faixa 4: Verde menta suave -->
    <polygon points="0,565 920,130 1000,130 1000,750 0,750" fill="#9fcbb8" />
    <!-- Faixa 5: Azul claro pastel -->
    <polygon points="80,700 980,260 1000,260 1000,750 80,750" fill="#9cbbdc" />
    <!-- Faixa 6: Verde claro (base direita) -->
    <polygon points="240,750 1000,380 1000,750" fill="#aed49e" />
  </g>

  <!-- Traços pretos soltos ao redor das asas -->
  <g stroke="#141414" stroke-width="11" stroke-linecap="round" fill="none">
    <!-- Traços à esquerda -->
    <line x1="131" y1="212" x2="155" y2="222" />
    <line x1="139" y1="260" x2="153" y2="265" />
    <!-- Traço à direita superior -->
    <line x1="756" y1="160" x2="788" y2="136" />
  </g>

  <!-- Pontas traseiras e dobras hachuradas da faixa (camada de fundo da fita) -->
  <g stroke="#141414" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cauda esquerda da fita (formato bandeirinha em V) -->
    <path d="M 173 356
             C 226 362, 276 386, 293 436
             L 285 505
             L 201 503
             C 188 492, 170 482, 146 473
             L 191 424 Z" fill="#e5e9e8" />

    <!-- Dobra interna esquerda (com hachuras verticais) -->
    <path d="M 206 452
             C 205 432, 250 432, 293 436
             L 286 498
             L 206 468 Z" fill="#d8dedd" />
    <!-- Linhas de hachura da dobra esquerda -->
    <g stroke-width="5.5">
      <line x1="221" y1="436" x2="219" y2="474" />
      <line x1="234" y1="435" x2="232" y2="480" />
      <line x1="248" y1="435" x2="246" y2="485" />
      <line x1="262" y1="436" x2="260" y2="490" />
      <line x1="276" y1="437" x2="274" y2="495" />
    </g>

    <!-- Cauda direita da fita (formato bandeirinha em V) -->
    <path d="M 695 393
             L 780 395
             L 728 449
             L 771 513
             C 738 515, 712 522, 688 532
             L 660 465 Z" fill="#e5e9e8" />

    <!-- Dobra interna direita (com hachuras verticais) -->
    <path d="M 584 504
             L 587 450
             C 625 448, 672 455, 676 472
             L 672 508 Z" fill="#d8dedd" />
    <!-- Linhas de hachura da dobra direita -->
    <g stroke-width="5.5">
      <line x1="599" y1="451" x2="598" y2="504" />
      <line x1="614" y1="452" x2="613" y2="502" />
      <line x1="628" y1="454" x2="627" y2="498" />
      <line x1="643" y1="457" x2="642" y2="493" />
      <line x1="657" y1="461" x2="656" y2="488" />
    </g>
  </g>

  <!-- Preenchimento amarelo das asas (Esquerda e Direita) -->
  <g fill="#dec949" stroke="none">
    <!-- Preenchimento Asa Esquerda -->
    <path d="M 365 186
             C 340 205, 333 206, 333 206
             C 280 170, 220 152, 150 154
             C 168 185, 188 210, 197 218
             C 202 250, 212 268, 214 270
             C 218 305, 236 330, 246 335
             C 252 372, 280 400, 325 403
             C 326 425, 346 435, 366 431
             C 374 452, 388 460, 400 456
             L 405 410 Z" />

    <!-- Preenchimento Asa Direita -->
    <path d="M 562 200
             C 575 215, 582 234, 582 234
             C 605 192, 665 180, 730 192
             C 780 200, 830 195, 874 180
             C 860 215, 845 235, 832 243
             C 818 290, 795 318, 780 326
             C 765 365, 730 392, 695 398
             C 680 432, 640 445, 602 433
             C 605 455, 590 468, 566 458
             C 562 480, 540 485, 520 470
             C 512 462, 506 454, 506 454
             C 500 464, 488 465, 476 456
             L 495 405 Z" />
  </g>

  <!-- Contornos pretos arredondados das asas e curvas internas das penas -->
  <g fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- Asa Esquerda: Topo e Pena 1 -->
    <path d="M 333 206
             C 280 170, 220 152, 150 154
             C 168 185, 190 212, 200 220
             C 235 242, 272 244, 295 233" />
    <!-- Asa Esquerda: Pena 2 -->
    <path d="M 196 216
             C 202 250, 220 275, 245 286
             C 275 297, 302 298, 318 295" />
    <!-- Asa Esquerda: Pena 3 -->
    <path d="M 213 267
             C 218 305, 240 335, 275 346
             C 298 354, 316 354, 328 352" />
    <!-- Asa Esquerda: Pena 4 -->
    <path d="M 245 333
             C 252 372, 280 400, 326 403
             C 340 404, 350 402, 355 400" />
    <!-- Asa Esquerda: Lobos inferiores sob o microfone -->
    <path d="M 325 403
             C 326 425, 346 435, 366 431
             C 374 452, 388 460, 398 456" />

    <!-- Asa Direita: Topo e Pena 1 -->
    <path d="M 582 234
             C 605 192, 665 180, 730 192
             C 780 200, 830 195, 874 180
             C 858 220, 825 255, 790 274
             C 745 298, 698 302, 669 288" />
    <!-- Asa Direita: Pena 2 -->
    <path d="M 832 243
             C 818 290, 785 326, 740 342
             C 700 355, 668 355, 647 351" />
    <!-- Asa Direita: Pena 3 -->
    <path d="M 780 326
             C 765 365, 730 392, 685 400
             C 650 406, 622 402, 600 395" />
    <!-- Asa Direita: Pena 4 -->
    <path d="M 695 398
             C 680 432, 640 445, 598 432
             C 584 426, 575 418, 571 414" />
    <!-- Asa Direita: Pena 5 -->
    <path d="M 602 433
             C 605 455, 590 468, 570 460
             C 558 454, 549 442, 544 434" />
    <!-- Asa Direita: Pena 6 (interna inferior) -->
    <path d="M 565 458
             C 562 480, 540 485, 520 470
             C 513 463, 508 455, 505 449" />
  </g>

  <!-- Base inferior do pedestal (aparecendo abaixo da faixa) -->
  <g fill="#acc8d0" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 302 628
             C 340 680, 480 684, 528 650
             L 505 642
             C 455 662, 360 660, 320 625 Z" />
  </g>

  <!-- Corpo azul-gelo do Microfone e Haste -->
  <g fill="#acc8d0" stroke="none">
    <!-- Cápsula principal inclinada -->
    <path d="M 366 165
             C 374 110, 430 98, 485 118
             C 545 110, 574 132, 569 175
             L 542 368
             C 532 412, 485 418, 440 417
             C 375 416, 332 398, 338 336 Z" />
    <!-- Pescoço / Haste do microfone -->
    <path d="M 392 414
             L 495 412
             L 468 468
             L 472 520
             L 398 520 Z" />
  </g>

  <!-- Contornos estruturais do Microfone, Haste e Parafuso Lateral -->
  <g fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cúpula superior direita e lateral direita -->
    <path d="M 465 144
             L 477 126
             C 502 110, 572 118, 568 172
             L 542 368
             C 530 412, 480 418, 435 417
             C 375 416, 332 396, 338 336" />

    <!-- Haste inferior do microfone e linha divisória central -->
    <path d="M 392 414 L 399 514" />
    <path d="M 444 416 L 428 514" />
    <path d="M 494 412 L 468 466" />

    <!-- Anel/Parafuso de articulação lateral direito -->
    <circle cx="469" cy="489" r="21" fill="#acc8d0" />
  </g>

  <!-- Grade detalhada do Microfone (ranhuras superiores, laterais, centrais e inferiores) -->
  <g stroke="#141414" stroke-width="10.5" stroke-linecap="round" fill="none">
    <!-- 3 ranhuras diagonais no topo esquerdo da cúpula -->
    <line x1="376" y1="141" x2="400" y2="114" />
    <line x1="406" y1="139" x2="434" y2="108" />
    <line x1="439" y1="142" x2="465" y2="115" />

    <!-- 8 barras curtas horizontais na borda esquerda do microfone -->
    <line x1="365" y1="169" x2="386" y2="167" />
    <line x1="360" y1="194" x2="384" y2="192" />
    <line x1="356" y1="219" x2="379" y2="218" />
    <line x1="351" y1="244" x2="374" y2="243" />
    <line x1="347" y1="269" x2="370" y2="269" />
    <line x1="343" y1="294" x2="366" y2="294" />
    <line x1="342" y1="317" x2="363" y2="317" />
    <line x1="342" y1="339" x2="361" y2="339" />

    <!-- 8 barras longas centrais da grade (levemente inclinadas) -->
    <line x1="413" y1="168" x2="497" y2="181" />
    <line x1="410" y1="193" x2="511" y2="208" />
    <line x1="408" y1="219" x2="510" y2="234" />
    <line x1="405" y1="245" x2="507" y2="260" />
    <line x1="402" y1="270" x2="503" y2="284" />
    <line x1="397" y1="294" x2="502" y2="309" />
    <line x1="391" y1="319" x2="496" y2="332" />
    <line x1="389" y1="344" x2="494" y2="356" />

    <!-- 8 dentes curtos na borda direita do microfone -->
    <line x1="545" y1="194" x2="564" y2="198" />
    <line x1="542" y1="218" x2="561" y2="222" />
    <line x1="539" y1="242" x2="558" y2="246" />
    <line x1="537" y1="266" x2="555" y2="270" />
    <line x1="534" y1="290" x2="552" y2="294" />
    <line x1="531" y1="314" x2="549" y2="318" />
    <line x1="528" y1="338" x2="546" y2="342" />
    <line x1="525" y1="360" x2="543" y2="364" />

    <!-- 3 barras verticais/diagonais na base (queixo) da cápsula -->
    <line x1="365" y1="369" x2="374" y2="405" />
    <line x1="391" y1="369" x2="404" y2="412" />
    <line x1="431" y1="372" x2="445" y2="415" />
  </g>

  <!-- Corpo frontal principal da faixa (Ribbon) -->
  <path d="M 206 452
           C 315 530, 555 532, 676 472
           C 684 510, 690 555, 692 594
           C 565 668, 310 655, 198 574
           C 199 535, 202 490, 206 452 Z"
        fill="#eff2f1" stroke="#141414" stroke-width="11" stroke-linejoin="round" stroke-linecap="round" />

  <!-- Pontos laterais pretos na faixa -->
  <circle cx="244" cy="549" r="12" fill="#141414" />
  <circle cx="655" cy="568" r="11.5" fill="#141414" />

  <!-- Tipografia desenhada à mão "BAR DA CÁCIA" seguindo perfeitamente a curvatura da faixa -->
  <g fill="none" stroke="#141414" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- B -->
    <path d="M 289 531 L 278 599" />
    <path d="M 289 531 C 306 533, 308 558, 284 563 C 308 567, 307 601, 278 599" />

    <!-- A -->
    <path d="M 309 606 L 328 538 L 334 609" />
    <path d="M 314 585 L 331 587" />

    <!-- R -->
    <path d="M 350 543 L 343 612" />
    <path d="M 350 543 C 369 545, 368 576, 347 577 L 364 615" />

    <!-- D -->
    <path d="M 392 549 L 387 618" />
    <path d="M 392 549 C 418 552, 416 618, 387 618" />

    <!-- A -->
    <path d="M 417 621 L 434 551 L 443 623" />
    <path d="M 422 598 L 439 599" />

    <!-- C -->
    <path d="M 488 559 C 474 544, 462 565, 463 592 C 464 616, 476 628, 488 616" />

    <!-- Á (com acento agudo) -->
    <path d="M 498 623 L 512 552 L 524 623" />
    <path d="M 502 599 L 520 599" />
    <path d="M 508 538 L 521 525" />

    <!-- C -->
    <path d="M 556 558 C 542 545, 532 565, 533 592 C 534 615, 545 626, 558 615" />

    <!-- I (com pequenas bases superior e inferior como no original) -->
    <path d="M 571 549 L 576 618" />
    <path d="M 565 549 L 577 549" />
    <path d="M 569 618 L 582 618" />

    <!-- A -->
    <path d="M 592 618 L 603 548 L 617 617" />
    <path d="M 595 596 L 613 595" />
  </g>
</svg>